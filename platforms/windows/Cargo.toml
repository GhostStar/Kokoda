[package]
name = "kokoda-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
kokoda-app-model = { path = "../../crates/app-model" }
kokoda-media = { path = "../../crates/media" }
serde_json.workspace = true
base64 = "0.22"
zeroize = "1"
winapi = { version = "0.3", features = ["winuser", "shellapi", "shellscalingapi", "winnt", "minwindef", "windef", "basetsd", "ntdef", "wingdi", "limits", "vadefs", "dwmapi", "processthreadsapi", "handleapi", "synchapi", "winbase", "dpapi", "wincrypt", "tlhelp32"] }
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole"] }

[build-dependencies]
cc = "=1.11.2"
