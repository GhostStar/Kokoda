[package]
name = "kokoda-host-settings-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
find-msvc-tools = "0.1"

[[bin]]
name = "KokodaHost"
path = "src/main.rs"

[dependencies]
kokoda-host = { path = "../../../crates/host" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
kokoda-discovery = { path = "../../../crates/discovery" }
zeroize = "1"
kokoda-host = { path = "../../../crates/host", features = ["windows-runtime"] }
kokoda-platform-windows = { path = "../../../platforms/windows" }
kokoda-transport = { path = "../../../crates/transport" }
winapi = { version = "0.3", features = ["winuser", "wingdi", "commdlg", "shellapi", "libloaderapi", "winnls", "jobapi2", "processthreadsapi", "handleapi", "synchapi", "errhandlingapi", "winerror", "winbase", "iphlpapi", "ipmib", "commctrl", "objbase", "combaseapi"] }
