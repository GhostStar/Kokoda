[workspace]
resolver = "2"
members = ["apps/host-settings/windows", "crates/app-model", "crates/client", "crates/host", "crates/media", "crates/protocol", "crates/transport", "crates/windows-host", "platforms/windows"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "none"
