[package]
name = "kokoda-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
kokoda-protocol = { path = "../protocol" }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.13"
subtle = "2"

opaque-ke = { version = "=5.0.0-pre.0", default-features = false, features = ["ristretto255", "argon2", "std"] }
sha2 = "0.11"
rand = "0.10"
zeroize = "1"
