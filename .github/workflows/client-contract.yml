name: Shared core contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        run: python scripts/prepare-ffmpeg.py
      - run: python tests/check-locales.py
      - run: cargo test --workspace --locked
      - name: Native macOS manager regressions
        if: runner.os == 'macOS'
        run: |
          for language in en zh-Hans; do
            KOKODA_TEST_LANGUAGE=$language scripts/run-macos-test.sh ManagerTests
            KOKODA_TEST_LANGUAGE=$language scripts/run-macos-test.sh LocalizationTests
          done
          for suite in MultiSessionTests SessionTests GroupTests WindowManagementTests ViewerSizingTests InputTests DragTests PasswordTests; do
            scripts/run-macos-test.sh "$suite"
          done
